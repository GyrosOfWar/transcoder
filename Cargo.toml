[package]
name = "transcoder"
version = "0.1.3"
edition = "2024"
repository = "https://github.com/GyrosOfWar/transcoder"

[dependencies]
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
console = "0.16.6"
human-repr = "1.1.0"
indicatif = { version = "0.18.6", features = ["rayon"] }
jiff = { version = "0.2.37", features = ["serde"] }
once_cell = "1.21.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_rusqlite = "0.43.0"
tabled = "0.22.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
